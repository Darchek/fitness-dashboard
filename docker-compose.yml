services:
  fitness-dashboard:
    image: fitness-dashboard:latest
    container_name: fitness-dashboard
    ports:
      - "3002:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
